<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Notes</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js" defer></script>
</head>

<body>
  <div id="app">
    <!-- 비밀번호 입력 화면 -->
    <div id="password-screen">
      <h1>기도 모임</h1>
      <input type="password" id="password-input" placeholder="모임 비밀번호 입력">
      <button id="join-group-btn">모임 입장</button>
    </div>

    <!-- 메인 화면 -->
    <div id="main-screen" class="hidden">
      <h1>기도 모임</h1>

      <!-- 탭 메뉴 -->
      <div id="tabs">
        <button id="participants-tab" class="tab-btn active">참여자 관리</button>
        <button id="prayer-notes-tab" class="tab-btn">기도제목 기록</button>
        <button id="view-notes-tab" class="tab-btn">기도제목 조회</button>
      </div>

      <!-- 참여자 관리 -->
      <div id="participants-section" class="tab-content active">
        <h2>참여자 관리</h2>
        <input type="text" id="participant-name-input" placeholder="참여자 이름">
        <button id="add-participant-btn">추가</button>
        <ul id="participants-list"></ul>
      </div>

      <!-- 기도 제목 관리 -->
      <div id="prayer-notes-section" class="tab-content">
        <h2>기도제목 기록</h2>
        <input type="date" id="note-date-input">
        <select id="participant-select"></select>
        <textarea id="prayer-note-input" placeholder="기도 제목 입력 (여러 줄 지원)"></textarea>
        <button id="add-note-btn">저장</button>
      </div>

      <!-- 조회 기능 -->
      <div id="view-notes-section" class="tab-content">
        <h2>기도제목 조회</h2>
        <div>
          <select id="filter-date-input">
            <option value="">날짜 선택</option>
          </select>
          <select id="filter-participant-select">
            <option value="">전체 참여자</option>
          </select>
          <button id="apply-filter-btn">필터 적용</button>
        </div>
        <div id="notes-display"></div>
      </div>
    </div>
  </div>
</body>

</html>
